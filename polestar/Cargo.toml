[package]
name = "polestar"
version = "0.1.0"
edition = "2024"
description = "Facade crate: re-exports polestar-core, with optional model checking"

[dependencies]
polestar-core = { workspace = true }
polestar-model-checker = { workspace = true, optional = true }

[features]
default = []

# serde impls for the id types
serde = ["polestar-core/serde"]

# Exhaustive traversal, LTL model checking and DOT diagrams
model-checker = ["dep:polestar-model-checker"]

# associated type defaults on Machine (nightly only)
nightly = ["polestar-core/nightly"]
