[package]
name = "polestar-model-checker"
version = "0.1.0"
edition = "2024"
description = "LTL model checking (safety and liveness via Büchi automata) for polestar Machines"

[dependencies]
polestar-core = { workspace = true }
polestar-traversal = { workspace = true }

anyhow = "1.0"
derive_bounded = "0.5"
derive_more = { version = "1", features = ["full"] }
exhaustive = "0.2"
im = { version = "15.1", features = ["rayon"] }
itertools = "0.14"
nom = "7.1"
petgraph = "0.8.3"
regex = "1.11"
tracing = "0.1"

[dev-dependencies]
polestar-diagram = { workspace = true }
polestar-model-checker = { path = ".", features = ["example-models"] }
tracing-subscriber = "0.3"

[features]
default = []

# Example models, used by this crate's tests and by polestar-experiments' examples
example-models = []
