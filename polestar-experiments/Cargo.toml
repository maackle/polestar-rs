[package]
name = "polestar-experiments"
version = "0.1.0"
edition = "2024"
description = "Half-baked and experimental polestar material: model/system mappings, event handlers, stochastic generation, deprecated diagram generators"

[dependencies]
polestar-core = { workspace = true, features = ["serde"] }
polestar-traversal = { workspace = true }
polestar-diagram = { workspace = true }
polestar-model-checker = { workspace = true, features = ["example-models"] }

anyhow = "1.0"
derive_more = { version = "1", features = ["full"] }
exhaustive = "0.2"
im = { version = "15.1", features = ["rayon"] }
itertools = "0.14"
num-traits = "0.2"
once_cell = "1.21"
parking_lot = "0.12"
petgraph = "0.8.3"
proptest = "1.2.0"
proptest-derive = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
num-derive = "0.4"
rand = "0.10"
tokio = { version = "1.44", features = ["full"] }
tracing-subscriber = "0.3"
