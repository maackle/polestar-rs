[package]
name = "polestar-experiments"
version = "0.1.0"
edition = "2024"
description = "Half-baked and experimental polestar material: model/system mappings, event handlers, stochastic generation, deprecated diagram generators"

[dependencies]
polestar-core = { workspace = true, features = ["serde"] }
polestar-traversal = { workspace = true }
polestar-diagram = { workspace = true }
polestar-model-checker = { workspace = true, features = ["example-models"] }

anyhow = { workspace = true }
derive_more = { workspace = true }
exhaustive = { workspace = true }
im = { workspace = true, features = ["rayon"] }
itertools = { workspace = true }
num-traits = { workspace = true }
once_cell = "1.21"
parking_lot = { workspace = true }
petgraph = { workspace = true }
proptest = "1.2.0"
proptest-derive = "0.5"
serde = { workspace = true }
serde_json = "1.0"
tracing = { workspace = true }

[dev-dependencies]
num-derive = "0.4"
rand = "0.10"
tokio = { version = "1.44", features = ["full"] }
tracing-subscriber = { workspace = true }
