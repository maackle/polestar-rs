[package]
name = "polestar-traversal"
version = "0.1.0"
edition = "2024"
description = "Parallel breadth-first traversal of a polestar Machine's state graph"

[dependencies]
polestar-core = { workspace = true }

anyhow = { workspace = true }
colored = "2.2"
crossbeam = { version = "0.8.4", features = ["crossbeam-channel"] }
derive_more = { workspace = true }
exhaustive = { workspace = true }
human-repr = { workspace = true }
im = { workspace = true, features = ["rayon"] }
itertools = { workspace = true }
parking_lot = { workspace = true }
petgraph = { workspace = true }
rayon = "1.10"
tracing = { workspace = true }
