[package]
name = "polestar-core"
version = "0.1.0"
edition = "2024"
description = "The Machine trait and the small set of well-exercised helpers around it"

[dependencies]
anyhow = { workspace = true }
derive_more = { workspace = true }
exhaustive = { workspace = true }
human-repr = { workspace = true }
im = { workspace = true }
itertools = { workspace = true }
num-traits = { workspace = true }
tracing = { workspace = true }

serde = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions = "1"

[build-dependencies]
rustversion = "1.0"

[features]
default = []

# serde impls for the id types
serde = ["dep:serde"]

# associated type defaults on Machine (nightly only)
nightly = []
